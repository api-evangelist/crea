- aid: crea:realtor-ca-ddf-lead-api
  name: REALTOR.ca DDF Lead API
  description: >-
    The DDF Lead API is a single documented POST endpoint, /v1/Lead/CreateLead, on the same
    ddfapi.realtor.ca host as the DDF Web API. CREA requires it because REALTOR email
    addresses are deliberately excluded from the DDF Web API payload - "Real Estate
    Advertising Websites (REAW) are required to use the DDF lead API, as email addresses are
    not included in the DDF Web API". A syndicating site presents an "Email REALTOR" form to
    a consumer and posts the resulting lead through this endpoint rather than emailing the
    agent directly. It is described in the same public OpenAPI document as the rest of DDF
    and carries the same OAuth 2.0 client-credentials gate.
  humanURL: https://ddfapi-docs.realtor.ca/
  baseURL: https://ddfapi.realtor.ca
  tags:
  - Leads
  - Property Listings
  - Canada
  properties:
  - type: OpenAPI
    url: openapi/crea-realtor-ca-ddf-web-api-openapi.json
    name: Lead endpoint is defined as POST /v1/Lead/CreateLead in the DDF Web API OpenAPI document
  - type: Documentation
    url: https://ddfapi-docs.realtor.ca/
  - type: Authentication
    url: openapi/crea-identity-openid-configuration.json
- aid: crea:realtor-ca-board-api
  name: REALTOR.ca Board API
  description: >-
    The REALTOR.ca Board API is a separate, smaller roster-distribution API for CREA's member
    boards and associations rather than for listing consumers. CREA describes it as "a data
    distribution API that allows Boards to access Members and Offices roster information
    built on modern industry standards" and states that "Board Data API is normalized based
    on the RESO Data Dictionary standards". Boards can enter data-sharing agreements with
    other boards to pull roster information for consenting partner boards. It exposes four
    documented operations - GET /Member, GET /Member/{MemberNationalAssociationId},
    GET /Office and GET /Office/{OfficeNationalAssociationId} - and is plain JSON rather than
    OData; every request must carry an Accept header of application/json or the service
    answers HTTP 406 "Invalid Accept Header". Authentication is OAuth 2.0 client credentials
    at https://identity.crea.ca/connect/token with scope BoardDataApi.read. Credentials are
    provided by CREA to boards; there is no self-serve path.
  humanURL: https://boardapi-docs.realtor.ca/
  baseURL: https://boardapi.realtor.ca/
  tags:
  - Roster
  - Agents
  - Brokerages
  - RESO
  - Canada
  properties:
  - type: OpenAPI
    url: openapi/crea-realtor-ca-board-api-openapi.json
    name: REALTOR.ca Board API OpenAPI 3.0.1, extracted verbatim from the public Redoc documentation at boardapi-docs.realtor.ca (HTTP 200, anonymous, 2026-07-26)
