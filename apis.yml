aid: crea
url: https://raw.githubusercontent.com/api-evangelist/crea/refs/heads/main/apis.yml
name: CREA (REALTOR.ca)
kind: company
description: >-
  The Canadian Real Estate Association (CREA) is the national industry body for Canadian
  residential real estate, representing roughly 160,000 REALTORS through some 60 member
  boards and associations, owning the MLS and REALTOR trademarks in Canada, and operating
  REALTOR.ca - the country's single national consumer listing portal. Where the United
  States fragments into roughly 500 independently governed MLSs, Canada consolidates: CREA
  runs the REALTOR.ca Data Distribution Facility (DDF), one national syndication seam that
  collects listing content from member boards' MLS Systems and redistributes it to member
  websites, franchisor pools, and a network of Real Estate Advertising Websites. That makes
  CREA simultaneously the standards-setter (it writes the DDF Policy and Rules that boards
  must adopt and enforce), the operator of the pipe, and the gatekeeper of the data. Its
  API posture is unusually good for an industry body and still firmly gated. Three real
  machine-readable contracts are downloadable anonymously - an OpenAPI 3.0.4 document for
  the DDF Web API served from ddfapi.realtor.ca/swagger/v1/swagger.json and embedded in the
  public Redoc site at ddfapi-docs.realtor.ca, an OpenAPI 3.0.1 document for the REALTOR.ca
  Board API at boardapi-docs.realtor.ca, and a full OpenID Connect discovery document at
  identity.crea.ca. The DDF Web API is an OData v4 surface normalized to the RESO Data
  Dictionary and described by CREA as built on the RESO Web API specification, but CREA is
  RESO-aligned rather than RESO-certified - it does not appear in RESO's public certification
  directory of 578 organizations, where the only Canadian entries are individual boards such
  as the Toronto Regional Real Estate Board and Greater Vancouver REALTORS, none of them
  Certified Current. Nothing is self-serve. There is no signup, no sandbox and no free tier;
  client_id and client_secret are, in CREA's own words, provided by CREA. A REALTOR must
  opt in through the DDF Dashboard on CREA's member portal, and a third-party developer must
  enter a data access agreement with CREA as a Technology Provider operating a National Pool
  Website or Member Website on behalf of that opted-in member. The OData $metadata document,
  the actual RESO contract, returns HTTP 401 to anonymous callers. No open, unlicensed
  Canadian listing dataset exists behind any of it.
