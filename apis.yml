apis:
- aid: crea:realtor-ca-ddf-web-api
  name: REALTOR.ca DDF Web API
  description: >-
    The REALTOR.ca DDF (Data Distribution Facility) Web API is CREA's national listing
    syndication API. CREA documents it as a platform that "allows you to query MLS System
    data using the RESO Web API specification, which is based on OData" and states that
    "MLS System data is normalized based on the RESO Data Dictionary standards". It exposes
    OData v4 collections for Property, Member, Office, OpenHouse and Destination, each with
    a key-addressed single-record form, plus Replication endpoints (PropertyReplication,
    MemberReplication, OfficeReplication) sorted by modification timestamp for periodic
    synchronization. Standard OData query options ($select, $filter, $top, $skip, $expand)
    are supported. Authentication is OAuth 2.0 client credentials against
    https://identity.crea.ca/connect/token with scope DDFApi_Read, returning a Bearer token
    valid for 60 minutes; credentials are issued by CREA against an active DDF data feed and
    an inactive feed yields no token. The OData $metadata document at
    https://ddfapi.realtor.ca/odata/v1/$metadata is the authoritative RESO-shaped contract
    but returned HTTP 401 (WWW-Authenticate: Bearer) to an anonymous probe on 2026-07-26 and
    could not be harvested. The OpenAPI document, by contrast, is served anonymously.
  humanURL: https://ddfapi-docs.realtor.ca/
  baseURL: https://ddfapi.realtor.ca/odata/v1
  tags:
  - Property Listings
  - MLS
  - RESO
  - OData
  - Syndication
  - Canada
  properties:
