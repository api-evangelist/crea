- target: $.components
  description: Add the securitySchemes the provider documents in prose but never declares in the spec.
  update:
    securitySchemes:
      CreaClientCredentials:
        type: oauth2
        description: CREA IdentityServer client credentials. client_id/client_secret are issued by CREA
          against an active DDF data feed; no self-serve signup exists.
        flows:
          clientCredentials:
            tokenUrl: https://identity.crea.ca/connect/token
            scopes:
              DDFApi_Read: Read access to the DDF Web API and the DDF Lead API
