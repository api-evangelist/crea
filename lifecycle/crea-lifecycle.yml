description: >-
  CREA runs the REALTOR.ca APIs as long-lived v1 surfaces with a dated release-notes page as the
  only lifecycle instrument. There is no published status page, no SLA, no deprecation policy
  document, no Sunset/Deprecation header support and no versioning policy - but there is a real,
  four-year, 24-entry release history that announces field deprecations with a named
  replacement, which is more lifecycle discipline than most industry bodies publish.
