description: >-
  Binds every agent-facing tool in the CREA estate to the REST operation that actually backs
  it. Two tool surfaces exist: the CANDIDATE server derived from the OpenAPI (mcp/crea-mcp.yml
  tools[]), which is 1:1 with REST by construction, and the third-party crea-ddf-mcp server,
  whose tools query a Postgres mirror of the DDF data rather than the live API — so its
  bindings are semantic, not operational. Neither CREA OpenAPI declares operationId on any
  operation except two OData replication paths, so operations are addressed here by
  "<method> <path>", which is how they appear verbatim in the specs.
