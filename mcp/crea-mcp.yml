third_party:
- name: crea-ddf-mcp
  status: published
  official: false
  transport: stdio
  registry: https://www.npmjs.com/package/crea-ddf-mcp
  version: 0.0.4
  author: Warya Wayne (@waryawayne)
  license: MIT
  description: Read-only MCP server that queries a Postgres database previously synced from the DDF Web
    API by the crea-ddf package. It deliberately does not call CREA endpoints and never sees CREA credentials,
    so its tools are database tools over a DDF mirror rather than API tools.
  tools:
  - ddf_runtime_status
  - ddf_db_list_tables
  - ddf_db_describe_table
  - ddf_db_table_fields
  - ddf_db_query_table
  - ddf_db_get_row
  - ddf_db_sample_table
  - ddf_db_latest_sync_runs
  resources:
  - crea-ddf://capabilities
  - crea-ddf://db/schema
  tables:
  - properties
  - members
  - offices
  - openHouses
  - destinations
  - watermarks
  - syncRuns
  - syncErrors
  source: https://registry.npmjs.org/crea-ddf-mcp (README, 2026-07-26)
notes:
- The DDF Web API is OData v4, so a faithful MCP server should expose $select/$filter/$top/ $skip/$orderby
  as structured tool inputs rather than one tool per canned query; the community server reaches the same
  end by syncing to Postgres and exposing a structured query tool.
- Every tool above is read-only except create_lead. See agentic-access/crea-agentic-access.yml for the
  recommended per-operation execution contract.
