source: openapi/crea-realtor-ca-ddf-web-api-openapi.json, openapi/crea-realtor-ca-board-api-openapi.json
description: CREA publishes no official MCP server for any REALTOR.ca API. Searches of the DDF and Board
  API documentation, the MCP registries and npm turned up no CREA-operated hosted or stdio server, and
  there is no CREA GitHub organization to host one. The tools[] below are a CANDIDATE surface derived
  one-to-one from the operations in the two harvested OpenAPI documents, so an agent-facing server could
  be stood up over the existing contract. One community server does exist and is recorded separately under
  third_party[].
server:
  name: crea-realtor-ca
  transport: http
  url: null
  status: not-published-by-provider
auth:
  model: oauth2-client-credentials
  token_endpoint: https://identity.crea.ca/connect/token
  scopes:
  - DDFApi_Read
  - BoardDataApi.read
  note: Credentials are issued by CREA against an active DDF data feed or a member board. There is no
    self-serve signup, so any MCP server over this API inherits a gated, per-tenant credential model rather
    than a user-supplied API key.
