description: >-
  CREA ships no first-party client libraries for any REALTOR.ca API. There is no CREA or
  REALTOR.ca GitHub organization (crea-ca, CREA-Canada, realtorca and
  CanadianRealEstateAssociation all return HTTP 404 from the GitHub API), no package on PyPI
  under realtor-ca-ddf / crea-ddf / ddf-api / realtorca, and the DDF Web API documentation
  tells developers to "use any API client of your choice" and points at Postman for testing
  rather than at an SDK. Everything below is community-built and unaffiliated with CREA.
official_sdks: false
official_sdk_count: 0
packages:
- language: typescript
  registry: npm
  name: crea-ddf
  version: 0.0.6
  url: https://www.npmjs.com/package/crea-ddf
  install: npm install crea-ddf
  license: MIT
  official: false
  author: Warya Wayne (@waryawayne)
  repository: https://github.com/WaryaWayne/creaDDF
  description: >-
    Effect-native TypeScript SDK for the CREA DDF API with Postgres sync and frontend-ready
    database queries. Wraps the OAuth 2.0 client-credentials handshake against
    identity.crea.ca and the OData v4 collections on ddfapi.realtor.ca, then mirrors them into
    a local Postgres schema (properties, members, offices, openHouses, destinations) via
    Drizzle.
  note: >-
    Community package. The linked GitHub repository returned HTTP 404 on 2026-07-26 (private
    or removed); only the published npm artifact could be verified.
