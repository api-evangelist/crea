aid: crea
name: CREA (REALTOR.ca)
review:
  question: >-
    Does CREA, the industry body that owns Canada's single national listing syndication
    seam, expose a real public developer surface, and does its RESO alignment translate
    into reachable data?
  answer: >-
    Yes to the surface, no to the data. CREA publishes two anonymously reachable Redoc
    documentation sites and three machine-readable contracts that can be downloaded with no
    credentials at all - an OpenAPI 3.0.4 document for the REALTOR.ca DDF Web API, an
    OpenAPI 3.0.1 document for the REALTOR.ca Board API, and a complete OpenID Connect
    discovery document at identity.crea.ca. That is a better public contract posture than
    most US MLSs. But there is no signup, no sandbox, no free tier and no self-serve key
    issuance anywhere. CREA's own quickstart lists the prerequisites as "client_id -
    provided by CREA" and "client_secret - provided by CREA". The OData $metadata document
    - the actual RESO contract - returns HTTP 401 to anonymous callers. And CREA is
    RESO-aligned, not RESO-certified.
  date: '2026-07-26'
  reviewer: API Evangelist
  tier: industry-body
  homeMarket: Canada

sectorPosture:
  homeMarket: Canada
  marketStructure: >-
    Canadian residential listings consolidate rather than fragment. Where the United States
    has roughly 500 independently governed MLSs, Canada has one national cooperative: CREA
    owns the MLS and REALTOR marks, operates REALTOR.ca as the single national consumer
    portal, and runs the Data Distribution Facility (DDF) as the one syndication seam that
    collects listing content from member boards' MLS Systems and redistributes it. CREA is
    therefore standards-setter, pipe operator and gatekeeper at once. Land registration is a
    separate and largely privatised layer - provincial registries operated under long
    concessions by commercial operators such as Teranet - and is out of scope for this repo.

  resoPosture:
    summary: >-
      RESO-aligned, not RESO-certified. The DDF Web API is an OData v4 surface that CREA
      documents as built on the RESO Web API specification and normalized to the RESO Data
      Dictionary, but CREA does not appear anywhere in RESO's public certification directory.
    resoCertified: false
    resoCertifiedRationale: >-
      The RESO certification directory at https://www.reso.org/certificates/ (HTTP 200,
      416,233 bytes, fetched anonymously 2026-07-26) was parsed in full. It lists 578
      organizations by name and Unique Organization Identifier. Neither "CREA", "Canadian
      Real Estate Association", "REALTOR.ca" nor "DDF" appears in that list. There is no
      RESO certificate, endorsement, Web API Core version or Data Dictionary version that
      can be attributed to CREA.
    resoVersionClaimed: >-
      None. CREA names no Web API Core version (2.0.0 / 2.1.0) and no Data Dictionary
      version (1.7 / 2.0 / 2.1) anywhere in its public documentation. It says only "the RESO
      Web API specification" and "the RESO Data Dictionary standards", unversioned.
    verbatimClaims:
      - quote: >-
          The DDF Web API platform allows you to query MLS System data using the RESO Web API
          specification, which is based on OData. For more information about RESO
          specification, please visit the RESO website.
        source: https://ddfapi-docs.realtor.ca/
        httpStatus: 200
      - quote: >-
          The platform standardizes how you access MLS System listing data received from
          boards and associations across Canada. MLS System data is normalized based on the
          RESO Data Dictionary standards.
        source: https://ddfapi-docs.realtor.ca/
        httpStatus: 200
      - quote: >-
          The REALTOR.ca Board API is a data distribution API that allows Boards to access
          Members and Offices roster information built on modern industry standards. Board
          Data API is normalized based on the RESO Data Dictionary standards.
        source: https://boardapi-docs.realtor.ca/
        httpStatus: 200
      - quote: >-
          [PropertyKey] is also known as [ListingKey] in the Web API according to RESO
          standards.
        source: https://ddfapi-docs.realtor.ca/
        httpStatus: 200
    canadianEntriesInResoDirectory:
      note: >-
        The only Canadian organizations in the RESO directory are individual boards and one
        board-technology cooperative. None is "Certified Current". This is the whole point:
        Canada's national body is absent, and the boards that are present have mostly not
        completed certification.
      entries:
        - name: Greater Vancouver REALTORS
          uoi: M00000671
          date: '2024-02-12'
          status: Uncertified
        - name: Nova Scotia Association of REALTORS
          uoi: M00000699
          date: '2022-08-15'
          status: Passed Current
        - name: Ottawa Real Estate Board
          uoi: M00000401
          date: '2020-06-19'
          status: Uncertified
        - name: REALTORS Association of Edmonton
          uoi: M00000692
          date: '2025-03-10'
          status: Passed Current
        - name: Saskatchewan REALTORS Association
          uoi: M00000698
          date: '2025-03-09'
          status: Uncertified
        - name: Toronto Regional Real Estate Board
          uoi: M00000527
          date: '2025-03-09'
          status: Uncertified
        - name: Vancouver Island Real Estate Board
          uoi: M00000576
          date: '2025-03-09'
          status: Passed Current
        - name: Winnipeg Regional Real Estate Board
          uoi: M00000647
          date: '2021-01-28'
          status: Uncertified
        - name: Information Technology Systems Ontario (ITSO)
          uoi: M00000807
          date: '2022-03-23'
          status: Passed Current
    odataMetadata:
      url: https://ddfapi.realtor.ca/odata/v1/$metadata
      httpStatus: 401
      wwwAuthenticate: Bearer
      body: >-
        {"error":{"message":"You are not authorized to perform this request. The format of
        the bearer token used is not valid.","code":"401"}}
      note: >-
        This is the RESO/OData machine-readable contract and it is NOT harvestable. It could
        not be saved. CREA's docs confirm the gate: "The complete set of DDF Web API Metadata
        can be found by querying https://ddfapi.realtor.ca/odata/v1/$metadata (Requires
        authentication)." The OpenAPI documents in openapi/ are a substitute contract, not
        the $metadata.
    upi:
      present: false
      note: >-
        No reference to the RESO Universal Property Identifier or Universal Parcel Identifier
        (UPI) was found in CREA's documentation, OpenAPI documents, or product pages. The DDF
        identifiers are CREA-native (ListingKey / PropertyKey, MemberKey, OfficeKey,
        DestinationKey, and National Association Ids on the Board API).

  accessGate:
    classification: licence-agreement
    compoundedBy: membership-required
    summary: >-
      A developer cannot obtain credentials by any self-serve route. Two doors exist, and
      both require paper. (1) As a CREA member: a REALTOR or broker owner must be a member of
      a CREA board or association and must opt in through the DDF Dashboard on CREA's member
      portal to create a data feed. (2) As a third party: a company must enter a data access
      agreement with CREA to become a DDF Technology Provider, and may only operate on behalf
      of an opted-in member Participant.
    whatMustBeSignedOrJoined:
      - >-
        A DDF data access agreement with CREA, for anyone acting as a Technology Provider.
        The DDF Policy and Rules define it verbatim: "Technology Provider - a company that has
        entered into a data access agreement with CREA to operate a National Pool Website or
        a Member Website on behalf of a Participant."
      - >-
        CREA / board membership as a REALTOR or Participating Brokerage, for anyone
        originating a feed. "Participants must opt-in to the National Shared Pool and/or
        Member Website Feed through the DDF Dashboard before retaining the services of a
        Technology Provider."
      - >-
        The DDF Policy and Rules themselves, which boards must adopt and enforce: "Boards and
        Associations that operate MLS Systems must adopt and enforce the DDF Rules
        established by CREA."
      - >-
        A licence grant flows to CREA in the other direction too: "Participating Brokerages
        that opt-in to any of the listing distribution channels hereby grant CREA a
        royalty-free, perpetual license to use, reproduce, transmit, distribute, and exhibit
        the Listing Content for the purposes of the DDF."
    credentialIssuance: >-
      Manual and by CREA. The public quickstarts on both documentation sites list the
      prerequisites as "client_id - provided by CREA" and "client_secret - provided by CREA".
      The DDF docs add that you must have "an active data feed with valid credentials to
      obtain an access token. An inactive feed will result in no access token returned."
    credentialSharingProhibited: >-
      "Participants may not share or disclose their DDF credentials, which includes usernames
      and passwords required to access the DDF, to a Technology Provider or any other party."
    selfServeSignup: false
    sandbox: none published
    freeTier: none published
    pricingPublished: false
    policySource:
      url: https://www.crea.ca/files/technology/english/DDFR-Policy-and-Rules-February-2024-ENG.pdf
      httpStatus: 200
      contentType: application/pdf
      bytes: 163898
      title: DATA DISTRIBUTION FACILITY (DDF) POLICY AND RULES, Revised January 2024
      access: freely and anonymously downloadable, no login, no click-through

  openData:
    exists: false
    rationale: >-
      No open, unlicensed, publicly callable Canadian listing dataset is published by CREA.
      Every listing surface is behind the DDF licence. CREA does publish national housing
      market statistics and the MLS Home Price Index publicly at
      https://www.crea.ca/housing-market-stats/ (HTTP 200) and https://stats.crea.ca/
      (HTTP 200), but those are web reports, charts and a Gatsby front end - no documented
      API, no bulk download contract and no licence terms making them open data. There is no
      Canadian federal counterweight in this repo comparable to HM Land Registry Price Paid
      or Ordnance Survey open products; Canadian land registration is provincial and largely
      privatised, so the public record itself is a commercial product.

  authModel:
    scheme: OAuth 2.0 / OpenID Connect, client credentials grant, Bearer tokens
    issuer: https://identity.crea.ca
    discoveryDocument:
      url: https://identity.crea.ca/.well-known/openid-configuration
      httpStatus: 200
      anonymous: true
      savedAs: openapi/crea-identity-openid-configuration.json
    jwks:
      url: https://identity.crea.ca/.well-known/openid-configuration/jwks
      httpStatus: 200
    tokenEndpoint: https://identity.crea.ca/connect/token
    authorizationEndpoint: https://identity.crea.ca/connect/authorize
    tokenLifetimeSeconds: 3600
    tokenLifetimeDocumented: The access token lasts for 60 minutes.
    scopesAdvertised:
      - openid
      - DDFApi_Read
      - OfferManagementApi.read.write
      - BoardDataApi.read
      - offline_access
    scopesNote: >-
      These are read verbatim from the anonymously served discovery document, not invented.
      DDFApi_Read is documented in the DDF quickstart and BoardDataApi.read in the Board API
      quickstart. OfferManagementApi.read.write is advertised by the identity server but has
      NO public documentation anywhere that could be found - see undocumentedSurfaces below.
    grantTypesSupported:
      - authorization_code
      - client_credentials
      - refresh_token
      - implicit
      - 'urn:ietf:params:oauth:grant-type:device_code'
      - 'urn:openid:params:grant-type:ciba'
    tokenEndpointAuthMethods:
      - client_secret_basic
      - client_secret_post
    pkce: S256 and plain both advertised
    par: pushed_authorization_request_endpoint advertised, not required
    claimsSupported:
      - sub
      - destinationid
    stackNote: >-
      The discovery document, the endpoint layout (/connect/token, /connect/introspect,
      /connect/ciba, /connect/par) and the Kestrel server header on ddfapi.realtor.ca are
      consistent with a .NET Duende/IdentityServer deployment. Not claimed as vendor fact,
      recorded as an observation.

