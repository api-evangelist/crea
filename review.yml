ecosystem:
  webhooks:
    present: false
    note: >-
      No webhook, event, callback or push-replication surface is documented. The DDF Web API
      documents polling instead - the Replication endpoints (PropertyReplication,
      MemberReplication, OfficeReplication) return records "sorted by a modification
      timestamp which should allow external systems to synchronize data periodically and
      check the records that have changed since the last run". RESO's own Push Replication
      with EntityEvent and Webhooks (RCP-28) is not implemented. Absence is the finding.
  sdks:
    present: false
    note: >-
      No first-party SDK, client library, CLI or code sample repository was found. No CREA
      GitHub organization exists - https://api.github.com/orgs/crea-ca returns 404. A
      personal GitHub user account "Crea-ca" exists but could not be attributed to the
      association, so it is deliberately not recorded as a property.
  postman:
    officialCollection: false
    note: >-
      No official Postman collection or public workspace was found. CREA nonetheless points
      developers at Postman in prose: "To test any request in the Web API you will need to
      send an access token which cannot be done through a typical web browser. Postman is the
      preferred option to quickly test out any request in the API", with screenshots. Guidance
      without an artifact.
  graphql:
    present: false
  asyncapi:
    present: false
  status:
    page: none found
  changelog:
    url: https://ddfapi-docs.realtor.ca/releasenotes
    httpStatus: 200
  rateLimits:
    published: false
    note: >-
      No rate-limit documentation was found. The DDF Web API documents OData $top/$skip
      paging and a documented error-code table, but no quota, throttle or retry policy.

challengerLayer:
  note: >-
    Recorded as market context only, not as CREA properties. A small Canadian challenger
    layer - HouseSigma, Wahi, Zolo, Properly - competes on data the incumbents control and
    has historically been in legal conflict with CREA and its boards over access to it.
    Repliers, a commercial aggregator, publicly documents reselling CREA DDF access, which is
    itself evidence of the licence gate: developers reach DDF through an intermediary that
    holds the agreement rather than holding one themselves.

conclusion: >-
  CREA is the cleanest illustration in this study of the gap between a published contract and
  a reachable API. Three real machine-readable documents can be downloaded by anyone with
  curl and no credentials, and two of them describe a RESO-shaped OData surface over the
  listing data of an entire country. None of that gets a developer a single listing record.
  The $metadata document is 401. The credentials are handed out by CREA to parties who have
  signed a data access agreement or who are dues-paying REALTORS. And the certification that
  would at least prove conformance does not exist - CREA is absent from a 578-organization
  RESO directory in which the only Canadian names are individual boards, none of them
  Certified Current. Documented, uncertified, and closed.
