undocumentedSurfaces:
  - name: Offer Management API
    evidence: >-
      The scope OfferManagementApi.read.write is advertised in the anonymously served OIDC
      discovery document at identity.crea.ca, and offerapi.realtor.ca resolves and answers a
      JSON 404. CREA announced an offer-management partnership with Openn North America for
      REALTOR.ca. No public documentation, OpenAPI document, base path or endpoint could be
      found for it.
    action: >-
      Deliberately NOT listed in apis.yml. The scope name is recorded here as observed
      evidence only. No endpoint, base URL or operation has been invented.
  - name: Legacy DDF RETS feed
    evidence: >-
      https://data.crea.ca/Login.svc/Login returns HTTP 401 with WWW-Authenticate Digest
      realm="CREA.Distribution" from Microsoft-IIS/10.0.
    action: >-
      NOT listed in apis.yml. It is live but undocumented publicly; the Web API is the
      documented successor.

